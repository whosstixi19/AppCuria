services:
  db-postgres:
    image: postgres:17-alpine
    container_name: curia-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Clave_curia
      POSTGRES_DB: curia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BD.sql:/docker-entrypoint-initdb.d/01-BD.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d curia"]
      interval: 5s
      timeout: 5s
      retries: 5

  app-curia:
    build:
      context: ./AplicacionCuria
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-2.0.51}
    container_name: curia-web
    restart: always
    depends_on:
      db-postgres:
        condition: service_healthy
    ports:
      - "80:5155"
      - "5155:5155"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5155"
      ConnectionStrings__DefaultConnection: "Host=db-postgres;Port=5432;Database=curia;Username=postgres;Password=Clave_curia"
      EmailSettings__From: "${SMTP_EMAIL:-}"
      EmailSettings__SmtpServer: "${SMTP_SERVER:-}"
      EmailSettings__Port: "${SMTP_PORT:-587}"
      EmailSettings__Username: "${SMTP_EMAIL:-}"
      EmailSettings__Password: "${SMTP_PASSWORD:-}"
      EmailSettings__EnableSsl: "true"

volumes:
  postgres_data:
