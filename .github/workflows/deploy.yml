name: CI/CD - Build & Deploy to Google Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: 1. Compilación y Validación (.NET 8)
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restaurar dependencias NuGet
      run: dotnet restore AplicacionCuria.sln

    - name: Compilar solución en Release
      run: dotnet build AplicacionCuria.sln --configuration Release --no-restore

    - name: Ejecutar pruebas unitarias
      run: dotnet test AplicacionCuria.sln --configuration Release --no-build

  deploy:
    name: 2. Despliegue Automático en Google Cloud
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Conectar por SSH y actualizar contenedores Docker
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.GCP_HOST }}
        username: ${{ secrets.GCP_USERNAME }}
        key: ${{ secrets.GCP_SSH_KEY }}
        script: |
          set -e
          if [ -d "$HOME/AppCuria" ]; then
            cd "$HOME/AppCuria"
          elif [ -d "$HOME/AplicacionCuria" ]; then
            cd "$HOME/AplicacionCuria"
          elif [ -d "$HOME/AplicacionCuria-main" ]; then
            cd "$HOME/AplicacionCuria-main"
          elif [ -d "AppCuria" ]; then
            cd AppCuria
          fi
          git fetch origin main
          git reset --hard origin/main
          if command -v docker > /dev/null 2>&1 && docker compose version > /dev/null 2>&1; then
            docker compose down || true
            docker compose up -d --build --force-recreate
            docker ps
          else
            sudo docker compose down || true
            sudo docker compose up -d --build --force-recreate
            sudo docker ps
          fi
