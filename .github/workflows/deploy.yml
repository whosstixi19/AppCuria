name: CI/CD - Build & Deploy to Google Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: 1. Compilación y Validación (.NET 8)
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restaurar dependencias NuGet
      run: dotnet restore AplicacionCuria/AplicacionCuria.csproj

    - name: Compilar proyecto en Release
      run: dotnet build AplicacionCuria/AplicacionCuria.csproj --configuration Release --no-restore

  deploy:
    name: 2. Despliegue Automático en Google Cloud
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Conectar por SSH y actualizar contenedores Docker
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.GCP_HOST }}
        username: ${{ secrets.GCP_USERNAME }}
        key: ${{ secrets.GCP_SSH_KEY }}
        script: |
          cd AppCuria
          git pull origin main
          sudo docker compose up -d --build
          sudo docker ps
